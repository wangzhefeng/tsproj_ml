schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 96
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/B_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/weather_15min_20250101_20260731T1345.csv
    backtest_path: dataset/aidc_load_15min_rolling/weather_15min_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_load_15min_rolling/weather_15min_future_proxy_20260731T1400_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  observed_past_lags: {}
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    direct_layout: single_model_horizon
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: cqr
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_length: 193
  window_length: 30
  train_window_length: null
output:
  scenario_subpath: aidc_load_15min_rolling/route_B/add_exogenous_weather_date
  setting_suffix: -conformal-intraday
  results_root: results
