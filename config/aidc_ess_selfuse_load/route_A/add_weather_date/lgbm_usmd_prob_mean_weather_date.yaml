# A — lightgbm — direct (5min 单变量 · 概率预测 quantile) · 外生 日期+气象)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_A/add_weather_date
    plot_overlay_path: forecasting_data/A_ESS_PCS_merged_5min_20251001_20260728.csv
    plot_overlay_col: pcs_power
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 288
    window_days: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: forecasting_data/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
    custom_features:
    - name: weather_derived
      history_path: exogenous_weather_raw/weather_derived_in_20251001_20260728.csv
      future_path: exogenous_weather_raw/weather_derived_future_20260729_20260731.csv
      ts_col: time
      columns:
      - rt_ssr
      - rt_tt2
      - cal_rh
      - rt_ws10
      - tt2_mean_3h
      - tt2_diff_1h
      - ssr_mean_3h
      categorical_columns: []
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  advanced_features:
    enable_advanced_features: true
    enable_rolling_features: true
    rolling_columns:
    - y
    rolling_windows:
    - 2016
    - 4032
    - 8064
    rolling_stats:
    - mean
    - std
    - min
    - max
    enable_diff_features: true
    diff_columns:
    - y
    diff_periods:
    - 288
    - 2016
    - 8064
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 高频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
