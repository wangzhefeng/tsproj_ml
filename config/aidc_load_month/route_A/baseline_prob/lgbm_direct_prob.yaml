schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 37
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_month/A_Loads_1day_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: chinese_holiday
    source_type: generated
    generator: chinese_holiday
    columns:
    - name: is_holiday
      role: known_future
      categorical: false
    - name: next_holiday_days
      role: known_future
      categorical: false
    time_col: time
    series_id_cols: []
    availability: generator_defined
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct:
      layout: independent_models
      align_to_target: false
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: linear
        trend_degree: 1
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
      scaling:
        method: none
        inverse: false
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 7
        - 14
        - 28
        - 60
        - 90
        stats:
        - mean
        - std
        - min
        - max
      expanding:
        columns:
        - value
        stats:
        - mean
        - std
      difference:
        columns:
        - value
        periods:
        - 1
        - 7
        - 28
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    n_estimators: 100
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  crossing:
    method: median_preserving_isotonic
    report_raw: true
validation:
  performance:
    multi_output_n_jobs: 8
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  origin_day: 25
  train_window_days: 120
  fold_count: 5
  stride_months: 1
output:
  scenario_subpath: aidc_load_month/route_A/baseline_prob
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
