# AIDC 功率日频聚合数据 A/B 路异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置
# 日频数据点少（301 行），关闭周期检测（slots_per_hour 对日频无意义）

tasks:
  - source_path: dataset/aidc_load_month/A_Loads_1day_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_A_1day
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 999.0  # 日频无日内周期，关闭
    max_short_run_points: 0
    long_run_score_multiplier: 10.0

  - source_path: dataset/aidc_load_month/B_Loads_1day_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_B_1day
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 999.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0
