schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/A_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: cqr
    coverage: 0.9
    min_scores: 30
    min_windows: 3
ensemble:
  members:
  - name: direct
    config_ref: lgbm_usmd_prob_mean_conformal.yaml
  - name: recursive
    config_ref: ensemble_members/lgbm_usbr_prob_mean_conformal_recursive.yaml
  oof:
    train_window_steps: 150
    fold_count: 1
    stride_steps: 1
  method:
    name: linear_blending
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  train_window_days: 120
  fold_count: 6
  stride_months: 1
output:
  scenario_subpath: aidc_power_month/route_A/freq_1day/baseline
  setting_suffix: -conformal
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
