# B — lightgbm — direct-recursive (5min 单变量 · 概率预测 quantile) · 外生 日期+气象)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_B_weather_date
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 288
    window_days: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: outlier_analysis/B_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: true
    date_history_path: date_in_20251001_20260728.csv
    date_future_path: date_future_in_20260729_20260805.csv
    date_ts_feat: date
    datetype_features:
    - date_type
    datetype_categorical_features:
    - date_type  # date_type 按类别传给 LightGBM
    enable_weather_features: true
    weather_history_path: weather_in_20251001_20260728.csv
    weather_future_path: weather_future_in_20260729_20260731.csv
    weather_ts_feat: ts
    weather_features:
    - rt_ssr
    - rt_ws10
    - rt_tt2
    - cal_rh
    - rt_ps
    - rt_rain
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 高频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
