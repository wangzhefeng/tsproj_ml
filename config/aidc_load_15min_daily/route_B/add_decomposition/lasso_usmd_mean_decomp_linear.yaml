# B — aidc_load_15min_daily — add_decomposition — 15min 模型测试配置；由 aidc_power_month/freq_1day/add_decomposition 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_daily/route_B/add_decomposition
    setting_suffix: -decomp-linear
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 60
    predict_steps: 96
    window_length: 30
    now_time: '2026-07-31T23:45:00'
    schedule_mode: daily
  target_series:
    data_dir: ./dataset/aidc_load_15min_daily/
    data_path: B_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: weather_15min_backtest_proxy_20260101_20260731.csv
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    enable_date_features: false
    enable_weather_features: true
    weather_history_path: weather_15min_20250101_20260731.csv
    weather_future_path: weather_15min_future_proxy_20260731_20260831.csv
    weather_ts_feat: ts
    weather_features:
    - rt_tt2
    - cal_rh
    - rt_ssr
    - rt_ws10
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  advanced_features:
    enable_advanced_features: true
    enable_rolling_features: true
    rolling_columns:
    - y
    rolling_windows:
    - 96
    - 192
    - 384
    - 672
    rolling_stats:
    - mean
    - std
    - min
    - max
    enable_diff_features: true
    diff_columns:
    - y
    diff_periods:
    - 96
    - 192
    - 672
  model_strategy:
    use_horizon_exogenous_for_direct: true
    align_direct_features_to_target: false
    model_type: lasso
    pred_method: univariate-single-multistep-direct
    predict_type: point
    enable_conformal_calibration: false
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    scale_features: true
    scale_target: false
    decomposition_method: linear
    decomposition_trend_degree: 1
    decomposition_trend_forecast: polynomial
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
