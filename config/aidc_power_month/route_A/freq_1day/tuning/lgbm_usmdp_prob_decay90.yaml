# A — lightgbm — direct-pointwise (日频单变量 · 概率预测 quantile)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_power_month/route_A/freq_1day/tuning
    setting_suffix: -decay90
  runtime:
    horizon_mode: calendar_month  # 预测 forecast_start 所在的完整自然月
    train_window_length: 120  # 固定训练天数，保持旧配置有效训练长度
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 304
    predict_steps: 30
    window_length: 150
    now_time: '2026-07-31T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_power_month/freq_1day/
    data_path: A_Loads_1day_sum_20251001_20260731.csv
    freq: 1D
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    - is_month_start
    - is_month_end
    - is_quarter_start
    - is_quarter_end
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    enable_lags_features: false  # USMDP 不构造 lag 列；日历/天气逐点模板
    lags: []
  model_strategy:
    quantile_monotone: true  # 逐行排序消除 quantile crossing
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-pointwise
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 90  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none  # tuning 对照组：不做目标分解
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
