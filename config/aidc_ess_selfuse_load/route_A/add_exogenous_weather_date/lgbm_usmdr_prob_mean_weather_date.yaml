schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/forecasting_data/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_ess_selfuse_load/exogenous_date_raw/date_in_20251001_20260728.csv
    future_path: dataset/aidc_ess_selfuse_load/exogenous_date_raw/date_future_in_20260729_20260814.csv
    time_col: date
    series_id_cols: []
    availability: column
    available_at_col: available_at
  - name: weather
    source_type: file
    columns:
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    - name: tt2_mean_3h
      role: known_future
      categorical: false
    - name: tt2_diff_1h
      role: known_future
      categorical: false
    - name: ssr_mean_3h
      role: known_future
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/exogenous_weather_raw/weather_derived_in_20250101_20260728.csv
    backtest_path: dataset/aidc_ess_selfuse_load/exogenous_weather_raw/weather_derived_backtest_forecast_20260628_20260728.csv
    future_path: dataset/aidc_ess_selfuse_load/exogenous_weather_raw/weather_derived_future_20260729_20260814.csv
    time_col: time
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  observed_past_lags: {}
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations: {}
strategy:
  name: recmo
  output_chunk_length: 96
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 9792
  train_window_steps: 8352
  fold_count: 5
  stride_steps: 288
output:
  scenario_subpath: aidc_ess_selfuse_load/route_A/add_exogenous_weather_date
  setting_suffix: ''
  results_root: results
