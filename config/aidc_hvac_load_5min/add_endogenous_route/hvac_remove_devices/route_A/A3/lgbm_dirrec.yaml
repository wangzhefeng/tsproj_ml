# HVAC历史回测配置；严格训练窗口，仅支持 --backtest-only。
# 离线补值和天气可得性假设不构成实盘证据；未执行模型训练。
schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - hvac_total_load_A
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: hvac_total_load_A
      role: target
      categorical: false
    history_path: dataset/aidc_hvac_load_5min/forecast_data/data_v1/hvac_remove_devices/route_A/A3_data.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: chinese_holiday
    source_type: generated
    generator: chinese_holiday
    columns:
    - name: is_holiday
      role: known_future
      categorical: false
    - name: next_holiday_days
      role: known_future
      categorical: false
    time_col: time
    series_id_cols: []
    availability: generator_defined
  - name: covariate_history
    source_type: file
    columns:
    - name: hvac_total_load_B
      role: observed_past
      categorical: false
    history_path: dataset/aidc_hvac_load_5min/forecast_data/data_v1/hvac_remove_devices/route_A/A3_data.csv
    time_col: time
    series_id_cols: []
    availability: source_time
    provider: persistence
features:
  target_lags:
    hvac_total_load_A:
    - 288
    - 576
    - 864
  observed_past_lags:
    hvac_total_load_B:
    - 288
    - 576
  datetime_features:
  - minute
  - hour
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    advanced:
      rolling:
        columns:
        - hvac_total_load_A
        windows:
        - 288
        - 576
        stats:
        - mean
        - std
        - min
        - max
      expanding:
        columns:
        - hvac_total_load_A
        stats:
        - mean
        - std
strategy:
  name: dirrec
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-08-17T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 8929
  train_history_steps: 2016
  train_window_steps: 865
  fold_count: 28
  stride_steps: 288
output:
  scenario_subpath: aidc_hvac_load_5min/add_endogenous_route/hvac_remove_devices/route_A/A3
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
