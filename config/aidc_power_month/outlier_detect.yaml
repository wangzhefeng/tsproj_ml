# AIDC 功率日频聚合数据 A/B 路异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置
# 日频数据点少（301 行），关闭周期检测（slots_per_hour 对日频无意义）
tasks:
  - source_path: dataset/aidc_power_month/A_Loads_1day_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_A_1day
    periodic_robust_z_threshold: 999.0  # 日频无日内周期，关闭周期检测

  - source_path: dataset/aidc_power_month/B_Loads_1day_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_B_1day
    periodic_robust_z_threshold: 999.0
