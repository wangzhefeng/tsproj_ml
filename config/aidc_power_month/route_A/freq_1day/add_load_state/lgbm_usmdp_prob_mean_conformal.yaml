# A — lightgbm — direct-pointwise (日频单变量 · 概率预测 quantile) # + 日度气象外生 · 预测原点负荷状态
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_power_month/route_A/freq_1day/add_load_state
    setting_suffix: -conformal-load-state
  runtime:
    horizon_mode: calendar_month  # 预测 forecast_start 所在的完整自然月
    train_window_length: 120  # 固定训练天数，保持旧配置有效训练长度
    forecast_mode: forecast
    is_testing: true
    is_forecasting: false
    history_length: 304
    predict_steps: 30
    window_length: 150
    now_time: '2026-07-31T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_power_month/freq_1day/
    data_path: A_Loads_1day_sum_20251001_20260731.csv
    freq: 1D
    target_ts_feat: time
    target: value
  exogenous_features:
    custom_features:
    - name: load_state
      history_path: load_state_features/A_load_state_history.csv
      future_path: null
      future_strategy: freeze_last_observation
      availability: end_of_period  # 当期结束后可得；预测期冻结原点最后状态
      ts_col: time
      columns:
      - state_z30_robust
      - state_z30_ready
      - state_slope30
      - state_slope30_ready
      - state_intraday_std
      - state_intraday_range
      - state_intraday_p95_p5_gap
      - state_intraday_cv
      - state_intraday_max_abs_step
      - state_intraday_peak_time_frac
      - state_intraday_range_pct
      - state_route_diff_pct
      - state_last_day_volatile
      - state_volatile_count_7d
      - state_volatile_count_30d
      categorical_columns: []
    enable_datetime_features: true  # 日期时间特征由目标时间戳直接派生
    enable_date_features: false  # 本场景没有 date_type
    date_history_path: null
    date_future_path: null
    strict_date_information_set: false
    weather_backtest_path: weather_daily_stats_backtest_proxy_20260101_20260731.csv
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    enable_weather_features: true
    weather_history_path: weather_daily_stats_20251001_20260731.csv
    weather_future_path: weather_daily_stats_future_20260801_20260831.csv  # 纯上一年同日代理，不含2026-08实测（derive_weather_daily_future.py）
    weather_ts_feat: ts
    weather_features:
    - rt_tt2   # 日均 2m 气温（Kelvin）
    - cal_rh   # 日均相对湿度 %
    - rt_ssr   # 日总辐射
    - rt_ws10  # 日均 10m 风速
    datetime_features:
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    - is_month_start
    - is_month_end
    - is_quarter_start
    - is_quarter_end
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    enable_lags_features: true  # USMDP safe-lag：显式开启目标滞后特征
    lags:
    - 31
    - 35
    - 42
    - 49
    - 56
    - 63
  model_strategy:
    enable_ensemble: false
    quantile_monotone: true  # 逐行排序消除 quantile crossing
    align_direct_features_to_target: true  # safe-lag：min(lags) >= horizon，只引用预测原点前真实目标
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-pointwise
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
    enable_conformal_calibration: true
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
