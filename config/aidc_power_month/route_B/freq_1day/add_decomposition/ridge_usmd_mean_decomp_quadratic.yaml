schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/B_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_20251001_20260731.csv
    backtest_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_future_20260801_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct:
      layout: independent_models
      align_to_target: false
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: linear
        trend_degree: 2
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
      scaling:
        method: none
        inverse: false
    feature_scaling:
      method: minmax
      grouped: false
      encode_categorical: false
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 7
        - 14
        - 28
        stats:
        - mean
        - std
        - min
        - max
      difference:
        columns:
        - value
        periods:
        - 1
        - 7
        - 28
strategy:
  name: direct
estimator:
  model_type: ridge
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  train_window_days: 120
  fold_count: 6
  stride_months: 1
output:
  scenario_subpath: aidc_power_month/route_B/freq_1day/add_decomposition
  setting_suffix: -decomp-quadratic
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
