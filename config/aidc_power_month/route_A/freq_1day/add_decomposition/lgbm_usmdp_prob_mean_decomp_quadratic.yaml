schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/A_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    - name: pred_rh
      role: ignored
      categorical: false
    - name: pred_ssrd
      role: ignored
      categorical: false
    - name: pred_tt2
      role: ignored
      categorical: false
    - name: pred_ws10
      role: ignored
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/weather_history_1day_20250101_20260731.csv
    future_path: dataset/aidc_power_month/freq_1day/weather_future_1day_20260801_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: forecast_origin
    inference_columns:
      rt_tt2: pred_tt2
      cal_rh: pred_rh
      rt_ssr: pred_ssrd
      rt_ws10: pred_ws10
features:
  target_lags:
    value:
    - 31
    - 35
    - 42
    - 49
    - 56
    - 63
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct:
      layout: single_model_horizon
      align_to_target: true
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: linear
        trend_degree: 2
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
      scaling:
        method: none
        inverse: false
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  crossing:
    method: median_preserving_isotonic
    report_raw: true
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  train_window_days: 120
  fold_count: 6
  stride_months: 1
output:
  scenario_subpath: aidc_power_month/route_A/freq_1day/add_decomposition
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
