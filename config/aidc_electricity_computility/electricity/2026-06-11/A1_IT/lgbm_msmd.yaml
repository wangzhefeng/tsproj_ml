# A1_IT — lightgbm — direct
base_config: config.multivariate_config
overrides:
  runtime:
    is_testing: true
    is_forecasting: false
    history_days: 19
    predict_days: 1
    window_days: 15
    now_time: '2026-06-11T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_electricity_computility/electricity/2026-06-11/demand_load/A1_IT/
    data_path: df_selected.csv
    freq: 5min
    target_ts_feat: count_data_time
    target: h_total_use
    target_series_numeric_features:
    - inference_active_jobs_roll_mean_12
    - inference_active_jobs_roll_mean_3
    - inference_active_jobs
    - inference_cpu_util_count
    - inference_memory_util_count
    - inference_memory_amount_count
    - inference_memory_total_count
    - inference_gpu_memory_util_count
    - inference_gpu_memory_amount_count
    - inference_gpu_memory_total_count
    - inference_gpu_util_count
    - inference_gpu_power_usage_count
    - training_to_inference_power_ratio
    - inference_gpu_power_usage_sum
    - inference_gpu_power_usage_sum_roll_mean_12
    - inference_memory_total_sum
    - inference_gpu_power_usage_sum_roll_mean_3
    - jobs_total_gpu_power_usage_sum_roll_mean_3
    - jobs_total_gpu_power_usage_sum_roll_mean_12
    - jobs_total_gpu_power_usage_sum
    - training_gpu_power_usage_sum_roll_mean_3
    - training_gpu_power_usage_sum_roll_mean_12
    - inference_gpu_memory_total_sum
    - training_gpu_power_usage_sum
    - training_share_gpu_power_usage
    - inference_share_gpu_power_usage
    - training_minus_inference_power_sum
    - pod_gpu_memory_util_std
    - inference_memory_util_std
    - training_gpu_util_std
    - training_gpu_power_usage_std
    - computility_feature_coverage_count
    - inference_present
    - training_memory_amount_std
    - training_gpu_power_usage_mean
    - inference_memory_amount_sum
    target_series_categorical_features: []
    target_series_drop_features: []
  exogenous_features:
    date_history_path: df_date.csv
    date_future_path: df_date_future.csv
    date_ts_feat: date
    weather_history_path: df_weather.csv
    weather_future_path: df_weather_future.csv
    weather_ts_feat: ts
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  advanced_features:
    enable_advanced_features: false
    enable_rolling_features: false
    enable_diff_features: false
    enable_pct_change_features: false
  model_strategy:
    model_type: lightgbm
    pred_method: multivariate-single-multistep-direct
  train_outlier:
    enable_train_outlier_handling: true
    train_outlier_method: local_interpolate
    high_outlier_threshold: null
    high_outlier_max_run_points: 4
    rise_outlier_max_run_points: 2
    rise_rebound_min_abs_diff: 1000.0
    low_outlier_threshold: null
    low_outlier_max_run_points: 4
    drop_outlier_max_run_points: 2
    drop_rebound_min_abs_diff: 1000.0
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 14
    enable_feature_selection: false
  eval_mask:
    mode: percentile
    percentile: 5.0
    min_value: null
    max_value: null
  performance:
    window_parallel_workers: 1
    multi_output_n_jobs: 8
    model_thread_count: 1
