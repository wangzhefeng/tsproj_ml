schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/B_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    value:
    - 31
    - 35
    - 42
    - 49
    - 56
    - 63
  observed_past_lags: {}
  datetime_features: []
  transformations:
    direct:
      layout: single_model_horizon
      align_to_target: true
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  crossing:
    method: median_preserving_isotonic
    report_raw: true
  intervals:
  - name: q10_q90
    lower_quantile: 0.1
    upper_quantile: 0.9
  calibration:
    method: cqr
    interval: q10_q90
    target_coverage: 0.9
    calibration_windows: 5
    min_windows: 3
    min_scores: 30
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  train_window_days: 120
  fold_count: 6
  stride_months: 1
output:
  scenario_subpath: aidc_power_month/route_B/freq_1day/baseline
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
