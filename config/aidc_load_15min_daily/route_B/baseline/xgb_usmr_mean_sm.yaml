# B — xgboost 单模型 — recursive (15min 单变量, daily 日级) — S1 成员池(关衰减, 与融合成员条件一致)
# 目的: 复现 ensemble 成员 xgb 的参数条件(默认参数+过滤 overrides),
# 与 lgb-only(nodecay) 对比单体精度, 归因 averaging 恶化机制。
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_daily/route_B/baseline
    setting_suffix: -sm  # 归因实验结果隔离
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 96
    window_days: 30
    schedule_mode: daily  # 日界对齐: 预测下一完整自然日
    now_time: '2026-07-31T23:45:00'
  target_series:
    data_dir: ./dataset/aidc_load_15min_daily/
    data_path: B_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  model_strategy:
    model_type: xgboost
    pred_method: univariate-single-multistep-recursive
  training_enhancement:
    enable_time_decay_sample_weight: false  # 与 ensemble 成员条件一致(无样本权重)
  train_outlier:
    enable_train_outlier_handling: false  # 已由 outlier_process 清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势,让模型预测平稳残差(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
