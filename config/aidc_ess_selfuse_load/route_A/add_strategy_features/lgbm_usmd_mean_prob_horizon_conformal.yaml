features:
  target_lags:
    value:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  observed_past_lags: {}
  datetime_features: []
  transformations:
    direct:
      layout: single_model_horizon
      align_to_target: false
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 2016
        - 4032
        - 8064
        stats:
        - mean
        - std
        - min
        - max
      difference:
        columns:
        - value
        periods:
        - 288
        - 2016
        - 8064
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing:
    method: median_preserving_isotonic
    report_raw: true
  intervals:
  - name: q10_q90
    lower_quantile: 0.1
    upper_quantile: 0.9
  calibration:
    method: cqr
    interval: q10_q90
    target_coverage: 0.9
    calibration_windows: 5
    min_windows: 3
    min_scores: 30
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 9792
  train_window_steps: 8352
  fold_count: 5
  stride_steps: 288
output:
  scenario_subpath: aidc_ess_selfuse_load/route_A/add_strategy_features
  setting_suffix: -horizon-conformal-strategy-c5
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
