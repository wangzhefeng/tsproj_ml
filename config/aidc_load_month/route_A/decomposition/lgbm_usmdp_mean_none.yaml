schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 34
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_month/A_Loads_1day_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_load_month/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_load_month/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
features:
  target_lags:
    value:
    - 34
    - 35
    - 42
    - 49
    - 56
    - 63
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct_layout: single_model_horizon
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_length: 304
  window_length: 150
  train_window_length: null
output:
  scenario_subpath: aidc_load_month/route_A/decomposition
  setting_suffix: -decomp-none
  results_root: results
