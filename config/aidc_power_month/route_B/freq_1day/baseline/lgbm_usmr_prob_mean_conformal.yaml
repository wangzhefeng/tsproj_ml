# B — lightgbm — recursive (日频单变量 · 概率预测 quantile)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_power_month/route_B/freq_1day/baseline
    setting_suffix: -conformal
  runtime:
    horizon_mode: calendar_month  # 预测 forecast_start 所在的完整自然月
    train_window_length: 120  # 固定训练天数，保持旧配置有效训练长度
    forecast_mode: forecast
    is_testing: true
    is_forecasting: false
    history_length: 304
    predict_steps: 30
    window_length: 150
    now_time: '2026-07-31T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_power_month/freq_1day/
    data_path: B_Loads_1day_sum_20251001_20260731.csv
    freq: 1D
    target_ts_feat: time
    target: value
  exogenous_features:
    date_history_path: null
    date_future_path: null
    weather_history_path: null
    weather_backtest_path: null
    weather_future_path: null
    strict_date_information_set: false
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    enable_datetime_features: false
    custom_features: []
    datetime_features: []
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  model_strategy:
    enable_ensemble: false
    quantile_monotone: true  # 逐行排序消除 quantile crossing
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
    enable_conformal_calibration: true
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
