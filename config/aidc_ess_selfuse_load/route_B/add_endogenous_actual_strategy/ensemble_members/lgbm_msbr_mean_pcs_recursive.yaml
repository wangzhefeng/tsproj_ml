schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - ess_power
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: ess_power
      role: target
      categorical: false
    - name: pcs_power
      role: observed_past
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/forecasting_data/B_ESS_PCS_merged_5min_20251001_20260728.csv
    time_col: time
    series_id_cols: []
    availability: source_time
    provider: persistence
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_ess_selfuse_load/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_ess_selfuse_load/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
features:
  target_lags:
    ess_power:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  observed_past_lags:
    pcs_power:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    direct_layout: independent_models
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
strategy:
  name: recursive
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_length: 577
  window_length: 30
  train_window_length: null
output:
  scenario_subpath: aidc_ess_selfuse_load/route_B/add_endogenous_actual_strategy/ensemble_members
  setting_suffix: -recursive-member
  results_root: results
