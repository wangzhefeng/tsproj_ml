# Seasonal-Naive 基线（昨日同时刻重放，等价评估内置 seasonal-naive 对照）。
# 实现：seasonaltemplate + recursive + 单一滞后 288 + equal_weight=true → 权重恒 [1.0]；
# recursive 且 horizon<=288 时滞后列全程引用实测值，逐步得「昨日同时刻」。
# A1 双路合计 data_v3；fold 几何与 ets.yaml 完全一致，结果可直接对照。
# 仅支持 --backtest-only，未执行正式模型。
schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - hvac_total_load_AB
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: hvac_total_load_AB
      role: target
      categorical: false
    history_path: dataset/aidc_hvac_load_5min/forecast_data/data_v3/hvac_all_devices/A1_all/data.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    hvac_total_load_AB:
    - 288
  observed_past_lags: {}
  datetime_features: []
  transformations: {}
strategy:
  name: recursive
estimator:
  model_type: st
  target_adapter: independent
  params:
    equal_weight: true
    day_type_split: false
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-09-16T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  fold_count: 12
  stride_steps: 288
  performance:
    window_parallel_workers: 1
    total_thread_limit: 1
  training_window:
    kind: rolling
    history_steps: 43200
output:
  scenario_subpath: aidc_hvac_load_5min/naive
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
