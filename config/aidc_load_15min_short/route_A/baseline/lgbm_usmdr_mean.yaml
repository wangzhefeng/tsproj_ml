# A — lightgbm — direct-recursive (15min 单变量) · 4h 超短期 horizon=16
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_short/route_A/baseline
    setting_suffix: -intraday  # 语义版本隔离(与 quantile 配置对齐)
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 30
    predict_steps: 16  # 4h = 16 x 15min
    window_length: 14
    schedule_mode: intraday  # 保留调度时刻: 从调度时刻起预测
    now_time: '2026-07-31T14:00:00'
  target_series:
    data_dir: ./dataset/aidc_load_15min_short/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:  # 4h 超短期: 近邻滞后(15min~4h) + 日/周周期
    - 1
    - 2
    - 3
    - 4
    - 8
    - 12
    - 16
    - 96
    - 192
    - 672
  model_strategy:
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 14  # 半衰期天数,超短期更倚重近期数据
  train_outlier:
    enable_train_outlier_handling: false  # 已由 outlier_process 清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: linear  # 窗口内线性目标分解（与 scale_target 互斥）
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
