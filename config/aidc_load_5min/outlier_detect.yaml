# AIDC 功率 5min 原始数据 A/B 路异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置
#
# 数据特征：AIDC 总用电功率，正常范围 9000~19000 kW。
# 低噪声段 z-score 会爆炸（MAD→0），必须用 spike_abs_diff 门槛过滤。

tasks:
  - source_path: dataset/aidc_load_5min/A_Loads_5min_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_A_5min
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 5.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0

  - source_path: dataset/aidc_load_5min/B_Loads_5min_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_B_5min
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 5.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0
