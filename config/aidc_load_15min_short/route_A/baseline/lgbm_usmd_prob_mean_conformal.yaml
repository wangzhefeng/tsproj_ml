# A — aidc_load_15min_short — baseline — 15min 模型测试配置；由 aidc_power_month/freq_1day/baseline 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_short/route_A/baseline
    setting_suffix: -conformal-intraday
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 16
    predict_steps: 16
    window_length: 15
    now_time: '2026-07-31T14:00:00'
    schedule_mode: intraday
  target_series:
    data_dir: ./dataset/aidc_load_15min_short/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    date_history_path: null
    date_future_path: null
    weather_history_path: null
    weather_backtest_path: null
    weather_future_path: null
    strict_date_information_set: false
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    enable_datetime_features: false
    custom_features: []
    datetime_features: []
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
    - 4
    - 8
    - 12
    - 16
    - 96
    - 192
    - 672
  advanced_features:
    enable_advanced_features: true
    enable_rolling_features: true
    rolling_columns:
    - y
    rolling_windows:
    - 16
    - 96
    - 672
    rolling_stats:
    - mean
    - std
    - min
    - max
    enable_diff_features: true
    diff_columns:
    - y
    diff_periods:
    - 1
    - 96
    - 672
  model_strategy:
    enable_ensemble: false
    quantile_monotone: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct
    predict_type: quantile
    quantiles:
    - 0.1
    - 0.5
    - 0.9
    enable_conformal_calibration: true
  training_enhancement:
    enable_time_decay_sample_weight: false
    decay_halflife_days: 14
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
