schema_version: 2
problem:
  time_col: time
  freq: 1ME
  horizon: 1
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1month/B_Loads_1month_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    - name: pred_rh
      role: ignored
      categorical: false
    - name: pred_ssrd
      role: ignored
      categorical: false
    - name: pred_tt2
      role: ignored
      categorical: false
    - name: pred_ws10
      role: ignored
      categorical: false
    history_path: dataset/aidc_power_month/freq_1month/weather_history_1month_20250131_20260731.csv
    future_path: dataset/aidc_power_month/freq_1month/weather_future_1month_20260831_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: forecast_origin
    inference_columns:
      rt_tt2: pred_tt2
      cal_rh: pred_rh
      rt_ssr: pred_ssrd
      rt_ws10: pred_ws10
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
  observed_past_lags: {}
  datetime_features:
  - month
  - quarter
  - year
  transformations:
    target:
      calendar_normalization:
        method: per_calendar_day
      decomposition:
        method: none
      scaling:
        method: none
        inverse: false
strategy:
  name: recursive
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    min_child_samples: 2
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  crossing:
    method: median_preserving_isotonic
    report_raw: true
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 10
  train_window_steps: 7
  fold_count: 3
  stride_steps: 1
output:
  scenario_subpath: aidc_power_month/route_B/freq_1month/window_length_8
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
