# B — lightgbm — recursive (5min 单变量 · 概率预测 quantile) · 外生 日期+气象)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_B/add_exogenous_weather_date
    plot_overlay_path: forecasting_data/B_ESS_PCS_merged_5min_20251001_20260728.csv
    plot_overlay_col: pcs_power
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: false
    history_length: 34
    predict_steps: 288
    window_length: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: forecasting_data/B_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    custom_features: []
    weather_backtest_path: exogenous_weather_raw/weather_derived_backtest_forecast_20260628_20260728.csv
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: forecast
    weather_future_source: forecast
    enable_date_features: true
    date_history_path: exogenous_date_raw/date_in_20251001_20260728.csv
    date_future_path: exogenous_date_raw/date_future_in_20260729_20260814.csv
    date_ts_feat: date
    strict_date_information_set: true
    datetype_features:
    - date_type
    datetype_categorical_features:
    - date_type
    enable_weather_features: true
    weather_history_path: exogenous_weather_raw/weather_derived_in_20250101_20260728.csv
    weather_future_path: exogenous_weather_raw/weather_derived_future_20260729_20260814.csv
    weather_ts_feat: time
    weather_features:
    - rt_ssr
    - rt_tt2
    - cal_rh
    - rt_ws10
    - tt2_mean_3h
    - tt2_diff_1h
    - ssr_mean_3h
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    enable_ensemble: false
    quantile_monotone: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 高频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
