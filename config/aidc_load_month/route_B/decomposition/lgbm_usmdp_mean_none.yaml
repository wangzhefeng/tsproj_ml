schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 34
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_month/B_Loads_1day_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    value:
    - 34
    - 35
    - 42
    - 49
    - 56
    - 63
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct:
      layout: single_model_horizon
      align_to_target: true
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 304
  train_window_steps: 116
  fold_count: 5
  stride_steps: 34
output:
  scenario_subpath: aidc_load_month/route_B/decomposition
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
