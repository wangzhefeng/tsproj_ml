# AIDC 功率 5min 原始数据 A/B 路异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置。
# 5min 是唯一异常处理层；15min/1D 只聚合本配置生成的清洗 CSV。
# 仅处理物理越界和两侧稳定同伴支持的孤立跳飞；持续负荷变化保留原值。

tasks:
  - source_path: dataset/aidc_load_5min/A_Loads_5min_20251001_20260731.csv
    time_col: time
    target_col: value
    route: power_A_5min
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 1500.0
    spike_companion_spread_threshold: 500.0
    auto_clean_spike: true
    # 通用统计规则不适用于此 5min 负荷场景，显式禁用。
    local_robust_z_threshold: .inf
    periodic_robust_z_threshold: .inf
    auto_clean_statistical: false

  - source_path: dataset/aidc_load_5min/B_Loads_5min_20251001_20260731.csv
    time_col: time
    target_col: value
    route: power_B_5min
    abs_low_threshold: 0.0
    abs_high_threshold: 25000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 1500.0
    spike_companion_spread_threshold: 500.0
    auto_clean_spike: true
    # 通用统计规则不适用于此 5min 负荷场景，显式禁用。
    local_robust_z_threshold: .inf
    periodic_robust_z_threshold: .inf
    auto_clean_statistical: false
