schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 96
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/B_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/weather_15min_20250101_20260731T1345.csv
    backtest_path: dataset/aidc_load_15min_rolling/weather_15min_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_load_15min_rolling/weather_15min_future_proxy_20260731T1400_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
probabilistic:
  mode: point
ensemble:
  members:
  - name: direct
    config_ref: lgbm_usmd_mean_control_no_cross_route.yaml
  - name: recursive
    config_ref: ensemble_members/lgbm_usbr_mean_control_no_cross_route_recursive.yaml
  oof:
    train_window_steps: 30
    fold_count: 1
    stride_steps: 1
  method:
    name: averaging
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_steps: 3264
  train_window_steps: 2784
  fold_count: 5
  stride_steps: 96
output:
  scenario_subpath: aidc_load_15min_rolling/route_B/add_endogenous_cross_route_weather_date
  setting_suffix: -control-no-cross-route-intraday
  results_root: results
