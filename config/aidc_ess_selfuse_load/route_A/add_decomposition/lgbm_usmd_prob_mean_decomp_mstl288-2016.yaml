schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/forecasting_data/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    value:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  observed_past_lags: {}
  datetime_features: []
  transformations:
    direct:
      layout: independent_models
      use_horizon_exogenous: false
      align_to_target: false
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: mstl
        periods:
        - 288
        - 2016
        robust: true
        trend_degree: 1
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
        seasonal_cycles: 4
      scaling:
        method: none
        inverse: false
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 2016
        - 4032
        - 8064
        stats:
        - mean
        - std
        - min
        - max
      difference:
        columns:
        - value
        periods:
        - 288
        - 2016
        - 8064
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 9792
  train_window_steps: 8352
  fold_count: 5
  stride_steps: 288
output:
  scenario_subpath: aidc_ess_selfuse_load/route_A/add_decomposition
  setting_suffix: -decomp-mstl288-2016
  results_root: results
