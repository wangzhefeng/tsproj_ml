# AIDC 月度用电量预测 — 日频 kWh 异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载
# 日频数据点少（301 行），关闭周期检测（slots_per_hour 对日频无意义）
# 参数按 kWh 量级校准（日用电量 22 万~38 万 kWh），阈值量级与 power_month 的 kW 阈值成比例放大

tasks:
  - source_path: dataset/aidc_power_month/A_Loads_1day_sum_20251001_20260728.csv
    time_col: time
    target_col: value
    route: load_month_A_1day
    abs_low_threshold: 0.0
    abs_high_threshold: 500000.0        # 日用电量物理上限 ~38万kWh, 留 ~30% 余量
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 28000.0   # diff P99(~18500) × 1.5
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 999.0  # 日频无日内周期，关闭
    max_short_run_points: 0
    long_run_score_multiplier: 10.0

  - source_path: dataset/aidc_power_month/B_Loads_1day_sum_20251001_20260728.csv
    time_col: time
    target_col: value
    route: load_month_B_1day
    abs_low_threshold: 0.0
    abs_high_threshold: 500000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 28000.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 999.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0
