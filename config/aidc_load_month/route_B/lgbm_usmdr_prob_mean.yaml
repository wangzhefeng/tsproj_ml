# B — lightgbm — direct-recursive (日频单变量 · 概率预测 quantile)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_month/route_B
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 304
    predict_steps: 34
    window_length: 150
    now_time: '2026-07-31T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_load_month/
    data_path: B_Loads_1day_mean_20251001_20260731.csv
    freq: 1D
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - day
    - weekday
    - week
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    - is_month_start
    - is_month_end
    - is_quarter_start
    - is_quarter_end
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  model_strategy:
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: linear  # 窗口内线性目标分解（与 scale_target 互斥）
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
