# B — aidc_load_15min_short — add_exogenous_weather_date — 15min 模型测试配置；由 aidc_power_month/freq_1day/add_exogenous_weather_date 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_short/route_B/add_exogenous_weather_date
    setting_suffix: -conformal-intraday
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 16
    predict_steps: 16
    window_length: 15
    now_time: '2026-07-31T14:00:00'
    schedule_mode: intraday
  target_series:
    data_dir: ./dataset/aidc_load_15min_short/
    data_path: B_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    date_history_path: null
    date_future_path: null
    weather_backtest_path: weather_15min_backtest_proxy_20260101_20260731.csv
    strict_date_information_set: false
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    enable_date_features: false
    enable_weather_features: true
    enable_datetime_features: true
    custom_features: []
    weather_history_path: weather_15min_20250101_20260731T1345.csv
    weather_future_path: weather_15min_future_proxy_20260731T1400_20260831.csv
    weather_ts_feat: ts
    weather_features:
    - rt_tt2
    - cal_rh
    - rt_ssr
    - rt_ws10
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
  time_lag_features:
    enable_lags_features: true
    lags:
    - 16
    - 96
    - 192
    - 672
  model_strategy:
    enable_ensemble: false
    quantile_monotone: true
    align_direct_features_to_target: true
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-pointwise
    predict_type: quantile
    quantiles:
    - 0.1
    - 0.5
    - 0.9
    enable_conformal_calibration: true
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 14
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
