schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/B_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  observed_past_lags: {}
  datetime_features: []
  transformations:
    direct:
      layout: independent_models
      align_to_target: false
    feature_scaling:
      method: minmax
      grouped: false
      encode_categorical: false
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 7
        - 14
        - 28
        stats:
        - mean
        - std
        - min
        - max
      difference:
        columns:
        - value
        periods:
        - 1
        - 7
        - 28
strategy:
  name: direct
estimator:
  model_type: enet
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  train_window_days: 120
  fold_count: 6
  stride_months: 1
output:
  scenario_subpath: aidc_power_month/route_B/freq_1day/baseline
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
