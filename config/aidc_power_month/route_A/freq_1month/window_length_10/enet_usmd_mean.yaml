# A — enet — direct (月频单变量 · 线性基线 point)
# tuning 变体：window_length=10（全量窗口），history_length=12
# ElasticNet：L1+L2 混合正则线性基线；scale_features 必开。
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_power_month/route_A/freq_1month/window_length_10
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    is_testing: true
    is_forecasting: false   # 2026-08 未来气象已补齐（前半月实测+去年同期仿真）
    forecast_mode: forecast  # 严格预测：仅使用预测原点可获得的气象
    history_length: 12   # window=10 硬校验要求 history>window；12 → 3 个滑窗与 baseline 可比（前 2 行为数据外 NaN，dropna 剔除）
    predict_steps: 1    # 月频预测 1 步 = 1 个月
    window_length: 10   # 全量 10 个月训练窗口（9 行训练 + 1 行目标）
    now_time: '2026-07-31T00:00:00'  # 月频月末标签
  target_series:
    data_dir: ./dataset/aidc_power_month/freq_1month/
    data_path: A_Loads_1month_sum_20251001_20260731.csv
    freq: 1ME           # 月频（框架已扩展支持）
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: true
    weather_history_path: weather_monthly_stats_202510_202607.csv
    weather_backtest_path: weather_monthly_stats_backtest_proxy_202604_202607.csv
    weather_future_path: weather_monthly_stats_future_202608.csv  # 纯上一年同月代理，不含2026-08实测
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    weather_ts_feat: ts
    weather_features:
    - rt_tt2   # 月均 2m 气温（Kelvin）
    - cal_rh   # 月均相对湿度 %
    - rt_ssr   # 月总辐射
    - rt_ws10  # 月均 10m 风速
    datetime_features:
    - month
    - quarter
    - year
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
  advanced_features:
    enable_advanced_features: false
  model_strategy:
    model_type: enet
    pred_method: univariate-single-multistep-direct
    align_direct_features_to_target: true  # one-step: lag1=最新已知月，天气=目标月
    predict_type: point
  training_enhancement:
    enable_time_decay_sample_weight: false
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: per_calendar_day  # 月总kWh÷当月天数建模，输出时乘回
    scale_features: true   # 线性模型：特征标准化必开
    decomposition_method: none

  performance:
    window_parallel_workers: 1
    multi_output_n_jobs: 1
    model_thread_count: 1
