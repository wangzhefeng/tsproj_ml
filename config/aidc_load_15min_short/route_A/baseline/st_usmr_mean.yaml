# A — aidc_load_15min_short — baseline — 15min 模型测试配置；由 aidc_power_month/freq_1day/baseline 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_short/route_A/baseline
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 30
    predict_steps: 16
    window_length: 14
    now_time: '2026-07-31T14:00:00'
    schedule_mode: intraday
  target_series:
    data_dir: ./dataset/aidc_load_15min_short/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
    - 4
    - 8
    - 12
    - 16
    - 96
    - 192
    - 672
  model_strategy:
    align_direct_features_to_target: false
    model_type: st
    pred_method: univariate-single-multistep-recursive
    predict_type: point
  training_enhancement:
    enable_time_decay_sample_weight: false
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
