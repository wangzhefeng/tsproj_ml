schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - y
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: y
      role: target
      categorical: false
    history_path: dataset/aidc_electricity_computility/electricity_computility/add_training_jobs/A3_F2_201_A_dataset_new.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    y:
    - 288
    - 576
    - 2016
  observed_past_lags: {}
  datetime_features:
  - minute
  - hour
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    feature_scaling:
      method: none
      grouped: false
      encode_categorical: false
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: none
      scaling:
        method: none
        inverse: false
    direct:
      layout: independent_models
      align_to_target: false
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    boosting_type: gbdt
    objective: regression_l1
    metric: mae
    n_estimators: 500
    learning_rate: 0.03
    max_bin: 63
    num_leaves: 63
    max_depth: -1
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    min_child_samples: 50
    verbose: -1
    force_col_wise: true
probabilistic:
  mode: point
  schema_version: 1
  conformal:
    method: none
validation:
  forecast_origin: '2026-01-14T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 8928
  train_window_steps: 4032
  training_scope:
    incomplete_series_policy: raise
    unknown_series_policy: raise
  training:
    early_stopping_patience: 100
    sample_weight:
      method: none
    tuning:
      method: none
    augmentation:
      method: none
    feature_selection:
      method: none
    learning_rate:
      method: fixed
    huber_delta: 1.0
    blend_weight_windows: 5
    estimator_ensemble:
      method: none
  train_outlier:
    method: none
  eval_mask:
    mode: percentile
    percentile: 5.0
    min_value: null
    max_value: null
  performance:
    window_parallel_workers: 1
    multi_output_n_jobs: 1
    quantile_parallel_workers: 1
    ensemble_parallel_workers: 1
    model_thread_count: 1
    step_logging: false
    forecast_log_interval: 24
  fold_count: 17
  stride_steps: 288
output:
  identity:
    scenario_subpath: ''
    setting_suffix: ''
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
