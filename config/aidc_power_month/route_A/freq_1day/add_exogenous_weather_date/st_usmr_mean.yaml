# A — st — recursive (日频单变量 · 季节模板基线 point) # + 日期时间外生 · control-no-weather
# SeasonalTemplate 使用目标 lag/day-of-week，不消费气象列；保留为日期时间对照。
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_power_month/route_A/freq_1day/add_exogenous_weather_date
    setting_suffix: -control-no-weather
  runtime:
    horizon_mode: calendar_month  # 预测 forecast_start 所在的完整自然月
    train_window_length: 120  # 固定训练天数，保持旧配置有效训练长度
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 304
    predict_steps: 30
    window_length: 150
    now_time: '2026-07-31T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_power_month/freq_1day/
    data_path: A_Loads_1day_sum_20251001_20260731.csv
    freq: 1D
    target_ts_feat: time
    target: value
  exogenous_features:
    custom_features: []
    enable_datetime_features: true  # SeasonalTemplate 用 dt_day_of_week 分工作日/周末模板
    enable_date_features: false  # 本场景没有 date_type
    date_history_path: null
    date_future_path: null
    strict_date_information_set: false
    enable_weather_features: false  # 模型实现不消费天气列
    weather_history_path: null
    weather_backtest_path: null
    weather_future_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    weather_ts_feat: ts
    weather_features:
    - rt_tt2   # 日均 2m 气温（Kelvin）
    - cal_rh   # 日均相对湿度 %
    - rt_ssr   # 日总辐射
    - rt_ws10  # 日均 10m 风速
    datetime_features:
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    - is_month_start
    - is_month_end
    - is_quarter_start
    - is_quarter_end
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  model_strategy:
    enable_ensemble: false
    align_direct_features_to_target: false
    model_type: st
    pred_method: univariate-single-multistep-recursive
    predict_type: point
  training_enhancement:
    enable_time_decay_sample_weight: false  # SeasonalTemplate 不使用样本权重
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
