schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - ess_power
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: ess_power
      role: target
      categorical: false
    - name: pcs_power
      role: observed_past
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/forecasting_data/B_ESS_PCS_merged_5min_20251001_20260728.csv
    time_col: time
    series_id_cols: []
    availability: source_time
    provider: persistence
probabilistic:
  mode: point
ensemble:
  members:
  - name: direct
    config_ref: lgbm_msmd_mean_pcs.yaml
  - name: recursive
    config_ref: ensemble_members/lgbm_msbr_mean_pcs_recursive.yaml
  oof:
    train_window_steps: 30
    fold_count: 1
    stride_steps: 1
  method:
    name: linear_blending
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 9792
  train_window_steps: 8352
  fold_count: 5
  stride_steps: 288
output:
  scenario_subpath: aidc_ess_selfuse_load/route_B/add_endogenous_actual_strategy
  setting_suffix: ''
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
