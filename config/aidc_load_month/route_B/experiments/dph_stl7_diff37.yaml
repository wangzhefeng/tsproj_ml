schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 37
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_month/B_Loads_1day_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: chinese_holiday
    source_type: generated
    generator: chinese_holiday
    columns:
    - name: is_holiday
      role: known_future
      categorical: false
    - name: next_holiday_days
      role: known_future
      categorical: false
    time_col: time
    series_id_cols: []
    availability: generator_defined
features:
  target_lags:
    value:
    - 37
    - 38
    - 42
    - 49
    - 56
    - 63
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct:
      layout: single_model_horizon
      align_to_target: true
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: stl
        periods:
        - 7
        robust: true
        trend_degree: 1
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
        seasonal_cycles: 4
      scaling:
        method: none
        inverse: false
    advanced:
      expanding:
        columns:
        - value
        stats:
        - mean
        - std
      difference:
        columns:
        - value
        periods:
        - 37
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    n_estimators: 100
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  origin_day: 25
  train_window_days: 120
  fold_count: 5
  stride_months: 1
output:
  scenario_subpath: aidc_load_month/route_B/experiments/dph_stl7_diff37
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
