# B — lightgbm — direct-pointwise (5min 单变量 · 概率预测 quantile) · 策略特征
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_B/add_strategy_features
    plot_overlay_path: forecasting_data/B_ESS_PCS_merged_5min_20251001_20260728.csv
    plot_overlay_col: pcs_power
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 288
    window_days: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: forecasting_data/B_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
    custom_features:
    - name: strategy_features
      history_path: forecasting_data/strategy_features/strategy_features_history_B.csv
      future_path: forecasting_data/strategy_features/strategy_features_future_B.csv
      ts_col: time
      columns:
      - actual_charge_binary
      - actual_discharge_binary
      - plan_charge_binary
      - plan_discharge_binary
      - actual_power_abs
      - plan_power_abs
      - charge_power_deviation
      - discharge_power_deviation
      - schedule_pattern_id
      - month
      - is_weekend
      - typical_ess_power
      categorical_columns: []  # schedule_pattern_id 作为数值列(LightGBM 天然支持整数编码)
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-pointwise
    predict_type: quantile
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
