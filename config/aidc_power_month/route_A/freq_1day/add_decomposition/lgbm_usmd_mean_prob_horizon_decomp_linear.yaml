schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/A_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_power_month/freq_1day/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_power_month/freq_1day/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_20251001_20260731.csv
    backtest_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_future_20260801_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 14
    - 28
  observed_past_lags: {}
  datetime_features:
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  - is_month_start
  - is_month_end
  - is_quarter_start
  - is_quarter_end
  transformations:
    direct_layout: single_model_horizon
    advanced:
      rolling_windows:
      - 7
      - 14
      - 28
      diff_periods:
      - 1
      - 7
      - 28
      pct_change_periods:
      - 1
      - 7
    target_transform:
      calendar_normalization: none
      decomposition: linear
      target_scaling: none
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: calendar_month
  history_length: 304
  window_length: 150
  train_window_length: 120
output:
  scenario_subpath: aidc_power_month/route_A/freq_1day/add_decomposition
  setting_suffix: -horizon-decomp-linear
  results_root: results
