# AIDC 2026-06-11 demand_load 异常检测配置
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置
#
# 各房间负荷量级差异大，按实际范围设 abs_low / abs_high / spike_abs_diff。
# spike_abs_diff 取该房间正常差分 P99 的 ~3 倍。

tasks:
  - source_path: dataset/aidc_electricity_computility/electricity/2026-06-11/demand_load/A1_01a/df_power.csv
    time_col: count_data_time
    target_col: h_total_use
    route: A1_01a
    abs_low_threshold: 0.0
    abs_high_threshold: 5000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 200.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 5.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0

  - source_path: dataset/aidc_electricity_computility/electricity/2026-06-11/demand_load/A1_201/df_power.csv
