# 15min 负荷峰谷检测
# 由 data_process/peak_valley_detection.py run_peak_valley_detection 加载，schema 独立于模型配置
tasks:
  - source_path: dataset/aidc_power_15min/A_Loads_15min_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_A_15min
    distance: 96        # 相邻峰谷最小间距 1 天（96 点）
    prominence: 200.0   # 显著度过滤：峰谷相对相邻极值至少 200
    top_n: 20

  - source_path: dataset/aidc_power_15min/B_Loads_15min_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_B_15min
    distance: 96
    prominence: 200.0
    top_n: 20
