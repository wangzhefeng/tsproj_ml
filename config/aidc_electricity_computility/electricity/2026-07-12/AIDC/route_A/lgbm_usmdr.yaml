# 2026-07-12 / AIDC/route_A — usmdr — LightGBM 模型测试
base_config: config.univariate_config
overrides:
  runtime:
    is_testing: true
    is_forecasting: false
    history_days: 32
    predict_steps: 288
    window_days: 15
    now_time: '2026-07-12T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_electricity_computility/electricity/2026-07-12/AIDC/route_A/
    data_path: df_power.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    # 日期类型：显式启用，并按离散类别传给 LightGBM。
    enable_date_features: true
    date_history_path: date_in_20260611_20260814.csv
    date_future_path: date_in_20260611_20260814.csv
    date_ts_feat: date
    datetype_features:
    - date_type
    datetype_categorical_features:
    - date_type
    # 原生气象：历史 rt_* 与未来 pred_* 在特征工程中统一为以下字段。
    enable_weather_features: true
    weather_history_path: weather_in_20260611_20260814.csv
    weather_future_path: weather_in_20260611_20260814.csv
    weather_ts_feat: ts
    weather_features:
    - rt_ssr
    - rt_ws10
    - rt_tt2
    - cal_rh
    - rt_ps
    - rt_rain
    weather_categorical_features: []
    # 与参考外生配置一致：仅保留无同义重复的 10 个 datetime 特征。
    enable_datetime_features: true
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 不传 categorical_feature 给 LightGBM
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
  train_outlier:
    enable_train_outlier_handling: true
    train_outlier_method: local_interpolate
    high_outlier_threshold: 15500.0
    high_outlier_max_run_points: 4
    rise_outlier_max_run_points: 2
    rise_rebound_min_abs_diff: 1000.0
    low_outlier_threshold: null
    low_outlier_max_run_points: 4
    drop_outlier_max_run_points: 2
    drop_rebound_min_abs_diff: 1000.0
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 14  # 半衰期天数,按数据漂移速度调整
  eval_mask:
    mode: absolute
    percentile: 5.0
    min_value: null
    max_value: 15500.0
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
  # preprocessing:
  #   scale_target: false
  #   target_scaler_type: standard
  #   inverse_target: false
  # advanced_features:
  #   enable_advanced_features: false
  #   enable_rolling_features: false
  #   enable_diff_features: false

  output:
    scenario_subpath: aidc_electricity_computility/electricity/2026-07-12/AIDC/route_A
