# 15min 负荷周期检测
# 由 data_process/periodicity_analysis.py run_periodicity_analysis 加载，schema 独立于模型配置
tasks:
  - source_path: dataset/aidc_power_15min/A_Loads_15min_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_A_15min
    max_lags: 400
    seasonal_period: 96   # 已知日周期 96 点，显式指定供 STL 使用

  - source_path: dataset/aidc_power_15min/B_Loads_15min_mean_20251001_20260728.csv
    time_col: time
    target_col: value
    route: power_B_15min
    max_lags: 400
    seasonal_period: 96
