# B — lightgbm — direct-pointwise (15min 单变量 · 概率预测 quantile) · 4h 超短期 horizon=16
base_config: config.univariate_config
overrides:
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 30
    predict_steps: 16  # 4h = 16 x 15min
    window_days: 14
    now_time: '2026-07-28T00:00:00'
  target_series:
    data_dir: ./dataset/aidc_power/
    data_path: derived/B_Loads_15min_mean_20251001_20260728.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - weekday
    - week
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:  # 4h 超短期: 近邻滞后(15min~4h) + 日/周周期
    - 1
    - 2
    - 3
    - 4
    - 8
    - 12
    - 16
    - 96
    - 192
    - 672
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-pointwise
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 14  # 半衰期天数,超短期更倚重近期数据
  train_outlier:
    enable_train_outlier_handling: false  # 日频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
