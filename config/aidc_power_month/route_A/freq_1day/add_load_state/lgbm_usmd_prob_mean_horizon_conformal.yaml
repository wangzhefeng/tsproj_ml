schema_version: 2
problem:
  time_col: time
  freq: 1D
  horizon: 31
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/A_Loads_1day_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_20251001_20260731.csv
    backtest_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_power_month/freq_1day/weather_daily_stats_future_20260801_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
  - name: load_state
    source_type: file
    columns:
    - name: state_z30_robust
      role: observed_past
      categorical: false
    - name: state_z30_ready
      role: observed_past
      categorical: false
    - name: state_slope30
      role: observed_past
      categorical: false
    - name: state_slope30_ready
      role: observed_past
      categorical: false
    - name: state_intraday_std
      role: observed_past
      categorical: false
    - name: state_intraday_range
      role: observed_past
      categorical: false
    - name: state_intraday_p95_p5_gap
      role: observed_past
      categorical: false
    - name: state_intraday_cv
      role: observed_past
      categorical: false
    - name: state_intraday_max_abs_step
      role: observed_past
      categorical: false
    - name: state_intraday_peak_time_frac
      role: observed_past
      categorical: false
    - name: state_intraday_range_pct
      role: observed_past
      categorical: false
    - name: state_route_diff_pct
      role: observed_past
      categorical: false
    - name: state_last_day_volatile
      role: observed_past
      categorical: false
    - name: state_volatile_count_7d
      role: observed_past
      categorical: false
    - name: state_volatile_count_30d
      role: observed_past
      categorical: false
    history_path: dataset/aidc_power_month/freq_1day/load_state_features/A_load_state_history.csv
    time_col: time
    series_id_cols: []
    availability: source_time
    provider: persistence
