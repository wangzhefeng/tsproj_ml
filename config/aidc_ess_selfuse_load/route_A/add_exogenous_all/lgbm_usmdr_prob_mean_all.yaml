# A — lightgbm — direct-recursive (5min 单变量 · 概率预测 quantile) · 外生 日期类型+日期时间+派生气象+计划策略)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_A/add_exogenous_all
    plot_overlay_path: forecasting_data/A_ESS_PCS_merged_5min_20251001_20260728.csv
    plot_overlay_col: pcs_power
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 288
    window_days: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: forecasting_data/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: true
    date_history_path: exogenous_date_raw/date_in_20251001_20260731.csv
    date_future_path: exogenous_date_raw/date_future_in_20260801_20260814.csv
    date_ts_feat: date
    datetype_features:
    - date_type
    datetype_categorical_features: []
    enable_weather_features: false  # 派生气象通过 custom_features 接入，避免与原生 weather 通路重复
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
    custom_features:
    - name: weather_derived
      history_path: exogenous_weather_raw/weather_derived_in_20250101_20260731.csv
      future_path: exogenous_weather_raw/weather_derived_future_20260801_20260814.csv
      ts_col: time
      columns:
      - rt_ssr
      - rt_tt2
      - cal_rh
      - rt_ws10
      - tt2_mean_3h
      - tt2_diff_1h
      - ssr_mean_3h
      categorical_columns: []
    - name: pcs_plan
      history_path: exogenous_strategy_plan/A_PCS_plan_5min_20251001_20260728.csv
      future_path: exogenous_strategy_plan/A_PCS_plan_future_5min_20260729_20260731.csv
      ts_col: time
      columns:
      - pcs_plan
      categorical_columns: []
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 高频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
