# A1 双路合计 data_v3；IT 为固定204点子集，不是全楼IT总负荷。
# 无异常清洗；离线补值/天气可得性假设不构成实盘证据。
# 90天训练、1天预测；仅支持 --backtest-only，未执行正式模型。
schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - hvac_total_load_AB
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: hvac_total_load_AB
      role: target
      categorical: false
    history_path: dataset/aidc_hvac_load_5min/forecast_data/data_v3/hvac_all_devices/A1_all/data.csv
    time_col: time
    series_id_cols: []
    availability: source_time
features:
  target_lags:
    hvac_total_load_AB:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
    - 4032
    - 6048
    - 8064
  observed_past_lags: {}
  datetime_features: []
  transformations:
    advanced:
      rolling:
        columns:
        - hvac_total_load_AB
        windows:
        - 288
        - 576
        - 1152
        - 2016
        - 4032
        - 8064
        stats:
        - mean
        - std
        - min
        - max
      expanding:
        columns:
        - hvac_total_load_AB
        stats:
        - mean
        - std
strategy:
  name: recursive
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-09-16T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 38305
  train_history_steps: 25920
  train_window_steps: 17569
  fold_count: 72
  stride_steps: 288
output:
  scenario_subpath: aidc_hvac_load_5min/baseline/A1_all/hvac_all_devices
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
