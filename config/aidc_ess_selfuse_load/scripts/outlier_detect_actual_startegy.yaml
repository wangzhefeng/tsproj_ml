# AIDC ESS PCS 充放电功率 A/B 路 5min 异常检测
# 由 data_process/outlier_process.py run_outlier_detection 加载，schema 独立于模型配置
#
# 数据特征：PCS 下发充放电功率（负=充电，正=放电），物理范围 -3500~9000 kW。
# A 路有 1 个极端异常点（-1.34 亿），B 路基本干净。
# 策略：物理边界硬截（abs_high 截掉设备不可能值）+ spike 检测孤立跳变。

tasks:
  - source_path: dataset/aidc_ess_selfuse_load/endogenous_strategy_actual/A_PCSMerged_5min_20251001_20260728.csv
    output_dir: dataset/aidc_ess_selfuse_load/endogenous_strategy_actual/outlier_analysis
    time_col: time
    target_col: value
    route: ESS_PCS_A
    review_daily_plots: false
    auto_clean_statistical: false
    abs_low_threshold: -5000.0
    abs_high_threshold: 10000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 5.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0

  - source_path: dataset/aidc_ess_selfuse_load/endogenous_strategy_actual/B_PCSMerged_5min_20251001_20260728.csv
    output_dir: dataset/aidc_ess_selfuse_load/endogenous_strategy_actual/outlier_analysis
    time_col: time
    target_col: value
    route: ESS_PCS_B
    review_daily_plots: false
    auto_clean_statistical: false
    abs_low_threshold: -5000.0
    abs_high_threshold: 10000.0
    spike_window: 2
    spike_z_threshold: 8.0
    spike_abs_diff_threshold: 500.0
    local_robust_z_threshold: 5.0
    periodic_robust_z_threshold: 5.0
    max_short_run_points: 0
    long_run_score_multiplier: 10.0
