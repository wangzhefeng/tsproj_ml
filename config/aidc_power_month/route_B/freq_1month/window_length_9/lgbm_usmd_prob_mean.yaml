schema_version: 2
problem:
  time_col: time
  freq: 1ME
  horizon: 1
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1month/B_Loads_1month_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_power_month/freq_1month/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_power_month/freq_1month/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_202510_202607.csv
    backtest_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_backtest_proxy_202604_202607.csv
    future_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_future_202608.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
  observed_past_lags: {}
  datetime_features:
  - month
  - quarter
  - year
  transformations:
    direct_layout: independent_models
    target_transform:
      calendar_normalization: per_calendar_day
      decomposition: none
      target_scaling: none
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    min_child_samples: 2
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_length: 11
  window_length: 9
  train_window_length: null
output:
  scenario_subpath: aidc_power_month/route_B/freq_1month/window_length_9
  setting_suffix: ''
  results_root: results
