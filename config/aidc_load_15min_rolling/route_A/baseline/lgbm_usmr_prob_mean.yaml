# A — lightgbm — recursive (15min 单变量, rolling 滚动 · 概率预测 quantile)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_rolling/route_A/baseline
    setting_suffix: -intraday  # 新语义版本结果隔离(保留旧结果)
  runtime:
    is_testing: true
    is_forecasting: true
    history_days: 60
    predict_steps: 96
    window_days: 30
    schedule_mode: intraday  # 保留调度时刻: 从调度时刻起预测
    now_time: '2026-07-28T14:00:00'
  target_series:
    data_dir: ./dataset/aidc_load_15min_rolling/
    data_path: A_Loads_15min_mean_20251001_20260728.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  model_strategy:
    model_type: lightgbm
    pred_method: univariate-single-multistep-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 已由 outlier_process 清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    detrend_target: true  # 特征工程前对 y 线性去趋势,让模型预测平稳残差(与 scale_target 互斥)
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 1
    model_thread_count: 8
