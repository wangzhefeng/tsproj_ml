schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 96
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/A_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/weather_15min_20250101_20260731T1345.csv
    backtest_path: dataset/aidc_load_15min_rolling/weather_15min_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_load_15min_rolling/weather_15min_future_proxy_20260731T1400_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  observed_past_lags: {}
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    direct:
      layout: single_model_horizon
      use_horizon_exogenous: true
      align_to_target: false
      horizon_feature:
        name: forecast_horizon_idx
        cyclical: true
    target:
      calendar_normalization:
        method: none
      decomposition:
        method: mstl
        periods:
        - 96
        - 672
        robust: true
        trend_degree: 1
        trend_forecast: polynomial
        damping: 0.98
        trend_lookback: 28
        seasonal_cycles: 4
      scaling:
        method: none
        inverse: false
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 96
        - 192
        - 384
        - 672
        stats:
        - mean
        - std
        - min
        - max
      difference:
        columns:
        - value
        periods:
        - 96
        - 192
        - 672
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_steps: 3264
  train_window_steps: 2784
  fold_count: 5
  stride_steps: 96
output:
  scenario_subpath: aidc_load_15min_rolling/route_A/add_decomposition
  setting_suffix: -horizon-decomp-mstl96-672
  results_root: results
