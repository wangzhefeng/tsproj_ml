schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 96
  targets:
  - value
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/B_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: chinese_holiday
    source_type: generated
    generator: chinese_holiday
    columns:
    - name: is_holiday
      role: known_future
      categorical: false
    - name: next_holiday_days
      role: known_future
      categorical: false
    time_col: time
    series_id_cols: []
    availability: generator_defined
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    - name: rt_dt
      role: known_future
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/weather_15min_20250101_20260731T1345.csv
    time_col: ts
    series_id_cols: []
    availability: column
    backtest_path: dataset/aidc_load_15min_rolling/weather_15min_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_load_15min_rolling/weather_15min_future_proxy_20260731T1400_20260831.csv
    available_at_col: available_at
features:
  target_lags:
    value:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  observed_past_lags: {}
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    advanced:
      rolling:
        columns:
        - value
        windows:
        - 96
        - 192
        - 384
        - 672
        stats:
        - mean
        - std
        - min
        - max
      expanding:
        columns:
        - value
        stats:
        - mean
        - std
strategy:
  name: dirrec
estimator:
  model_type: histgb
  target_adapter: independent
  params: {}
probabilistic:
  mode: point
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_steps: 6336
  train_window_steps: 2784
  fold_count: 31
  stride_steps: 96
output:
  scenario_subpath: aidc_load_15min_rolling/route_B/add_exogenous
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
