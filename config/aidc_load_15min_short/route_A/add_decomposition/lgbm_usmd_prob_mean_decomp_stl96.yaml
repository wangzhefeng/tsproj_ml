schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 16
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_short/A_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_load_15min_short/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_load_15min_short/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    history_path: dataset/aidc_load_15min_short/weather_15min_20250101_20260731T1345.csv
    backtest_path: dataset/aidc_load_15min_short/weather_15min_backtest_proxy_20260101_20260731.csv
    future_path: dataset/aidc_load_15min_short/weather_15min_future_proxy_20260731T1400_20260831.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
    - 4
    - 8
    - 12
    - 16
    - 96
    - 192
    - 672
  observed_past_lags: {}
  datetime_features:
  - hour
  - minute
  - day
  - day_of_week
  - week_of_year
  - month
  - days_in_month
  - quarter
  - day_of_year
  - year
  transformations:
    direct_layout: independent_models
    advanced:
      rolling_windows:
      - 16
      - 96
      - 672
      diff_periods:
      - 1
      - 96
      - 672
      pct_change_periods:
      - 1
      - 7
    target_transform:
      calendar_normalization: none
      decomposition: stl
      target_scaling: none
strategy:
  name: direct
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_length: 33
  window_length: 15
  train_window_length: null
output:
  scenario_subpath: aidc_load_15min_short/route_A/add_decomposition
  setting_suffix: -decomp-stl96
  results_root: results
