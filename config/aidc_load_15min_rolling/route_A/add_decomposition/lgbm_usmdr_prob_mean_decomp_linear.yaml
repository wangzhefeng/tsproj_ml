# A — aidc_load_15min_rolling — add_decomposition — 15min 模型测试配置；由 aidc_power_month/freq_1day/add_decomposition 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_rolling/route_A/add_decomposition
    setting_suffix: -decomp-linear
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: false
    history_length: 34
    predict_steps: 96
    window_length: 30
    now_time: '2026-07-31T14:00:00'
    schedule_mode: intraday
  target_series:
    data_dir: ./dataset/aidc_load_15min_rolling/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: weather_15min_backtest_proxy_20260101_20260731.csv
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    enable_date_features: false
    enable_weather_features: true
    weather_history_path: weather_15min_20250101_20260731T1345.csv
    weather_future_path: weather_15min_future_proxy_20260731T1400_20260831.csv
    weather_ts_feat: ts
    weather_features:
    - rt_tt2
    - cal_rh
    - rt_ssr
    - rt_ws10
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  model_strategy:
    use_horizon_exogenous_for_direct: true
    quantile_monotone: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    block_size: 24  # 显式块长：替代 block_size=0 按 min(lags) 推导的退化默认值
    predict_type: quantile
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: false
    decay_halflife_days: 60
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    scale_target: false
    decomposition_method: linear
    decomposition_trend_degree: 1
    decomposition_trend_forecast: polynomial
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
