# A 路总负荷 — LightGBM — USMD — 无跨路内生协变量 control + datetime/weather
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_rolling/route_A/add_endogenous_cross_route_weather_date
    setting_suffix: -control-no-cross-route-intraday
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: false
    history_length: 34
    predict_steps: 96
    window_length: 30
    now_time: '2026-07-31T14:00:00'
    schedule_mode: intraday
  target_series:
    data_dir: ./dataset/aidc_load_15min_rolling/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    enable_date_features: false
    date_history_path: null
    date_future_path: null
    strict_date_information_set: false
    datetype_features: []
    datetype_categorical_features: []
    enable_weather_features: true
    weather_history_path: weather_15min_20250101_20260731T1345.csv
    weather_backtest_path: weather_15min_backtest_proxy_20260101_20260731.csv
    weather_future_path: weather_15min_future_proxy_20260731T1400_20260831.csv
    weather_ts_feat: ts
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    weather_features:
    - rt_tt2
    - cal_rh
    - rt_ssr
    - rt_ws10
    enable_datetime_features: true
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
    custom_features: []
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  advanced_features:
    enable_advanced_features: false
  model_strategy:
    enable_ensemble: false
    use_horizon_exogenous_for_direct: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct
    predict_type: point
  training_enhancement:
    enable_time_decay_sample_weight: false
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    decomposition_method: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
