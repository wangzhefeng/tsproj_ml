schema_version: 2
problem:
  time_col: time
  freq: 5min
  horizon: 288
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_ess_selfuse_load/forecasting_data/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: date_type
    source_type: file
    columns:
    - name: date_type
      role: known_future
      categorical: true
    history_path: dataset/aidc_ess_selfuse_load/ETTm1_exogenous/df_date.csv
    future_path: dataset/aidc_ess_selfuse_load/ETTm1_exogenous/df_date_future.csv
    time_col: date
    series_id_cols: []
    availability: forecast_origin
features:
  target_lags:
    value:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  observed_past_lags: {}
  datetime_features: []
  transformations:
    target_transform:
      calendar_normalization: none
      decomposition: stl
      target_scaling: none
strategy:
  name: recmo
  output_chunk_length: 96
estimator:
  model_type: lightgbm
  target_adapter: independent
  params: {}
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-28T23:55:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_length: 577
  window_length: 30
  train_window_length: null
output:
  scenario_subpath: aidc_ess_selfuse_load/route_A/add_decomposition
  setting_suffix: -decomp-stl288
  results_root: results
