# AIDC ESS 站用电 A/B 路 5min 周期检测（异常值清洗后数据）
# 由 data_process/periodicity_analysis.py run_periodicity_analysis 加载，schema 独立于模型配置
tasks:
  - source_path: dataset/aidc_ess_selfuse_load/outlier_analysis/A_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    time_col: time
    target_col: value
    route: ESS_A_5min
    max_lags: 1200        # 约 4 天（对齐 15min 场景 400 点的窗口口径）
    seasonal_period: 288  # 已知日周期 288 点，显式指定供 STL 使用

  - source_path: dataset/aidc_ess_selfuse_load/outlier_analysis/B_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    time_col: time
    target_col: value
    route: ESS_B_5min
    max_lags: 1200
    seasonal_period: 288
