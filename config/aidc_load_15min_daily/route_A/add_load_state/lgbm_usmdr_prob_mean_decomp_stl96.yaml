# A — aidc_load_15min_daily — add_load_state — 15min 模型测试配置；由 aidc_power_month/freq_1day/add_load_state 同名模板按频率语义转换
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_load_15min_daily/route_A/add_load_state
    setting_suffix: -decomp-stl96-load-state
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 34
    predict_steps: 96
    window_length: 30
    now_time: '2026-07-31T23:45:00'
    schedule_mode: daily
  target_series:
    data_dir: ./dataset/aidc_load_15min_daily/
    data_path: A_Loads_15min_mean_20251001_20260731.csv
    freq: 15min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: weather_15min_backtest_proxy_20260101_20260731.csv
    strict_weather_information_set: true
    weather_history_source: actual
    weather_backtest_source: proxy
    weather_future_source: proxy
    enable_date_features: false
    enable_weather_features: true
    weather_history_path: weather_15min_20250101_20260731.csv
    weather_future_path: weather_15min_future_proxy_20260731_20260831.csv
    weather_ts_feat: ts
    weather_features:
    - rt_tt2
    - cal_rh
    - rt_ssr
    - rt_ws10
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []
    custom_features:
    - name: load_state
      history_path: load_state_features/A_load_state_history.csv
      future_path: null
      future_strategy: freeze_last_observation
      availability: end_of_period
      ts_col: time
      columns:
      - state_roll_1h_mean
      - state_roll_1h_std
      - state_roll_4h_mean
      - state_roll_4h_std
      - state_roll_24h_mean
      - state_roll_24h_std
      - state_roll_24h_range
      - state_roll_7d_mean
      - state_roll_7d_std
      - state_diff_15min
      - state_diff_1h
      - state_diff_24h_pct
      - state_robust_z_7d
      - state_weekly_base_dev_pct
      - state_route_diff_pct
      categorical_columns: []
  time_lag_features:
    lags:
    - 96
    - 192
    - 288
    - 384
    - 480
    - 576
    - 672
  model_strategy:
    use_horizon_exogenous_for_direct: true
    quantile_monotone: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    block_size: 24  # 显式块长：替代 block_size=0 按 min(lags) 推导的退化默认值
    predict_type: quantile
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: false
    decay_halflife_days: 60
  train_outlier:
    enable_train_outlier_handling: false
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
    scale_target: false
    decomposition_method: stl
    decomposition_periods:
    - 96
    decomposition_robust: true
    decomposition_trend_degree: 1
    decomposition_trend_forecast: polynomial
    decomposition_seasonal_cycles: 4
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
