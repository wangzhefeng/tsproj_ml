schema_version: 2
problem:
  time_col: time
  freq: 15min
  horizon: 96
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_load_15min_rolling/B_Loads_15min_mean_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing:
    method: median_preserving_isotonic
    report_raw: true
  intervals:
  - name: q10_q90
    lower_quantile: 0.1
    upper_quantile: 0.9
  calibration:
    method: cqr
    interval: q10_q90
    target_coverage: 0.9
    calibration_windows: 5
    min_windows: 3
    min_scores: 30
ensemble:
  members:
  - name: direct
    config_ref: lgbm_usmd_prob_mean_conformal.yaml
  - name: recursive
    config_ref: ensemble_members/lgbm_usbr_prob_mean_conformal_recursive.yaml
  oof:
    train_window_steps: 30
    fold_count: 1
    stride_steps: 1
  method:
    name: linear_blending
validation:
  forecast_origin: '2026-07-31T14:00:00'
  schedule_mode: intraday
  horizon_mode: fixed_steps
  history_steps: 3264
  train_window_steps: 2784
  fold_count: 5
  stride_steps: 96
output:
  scenario_subpath: aidc_load_15min_rolling/route_B/baseline
  setting_suffix: -conformal-intraday
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
