# B — lightgbm — direct-recursive (5min 单变量 · 概率预测 quantile)
base_config: config.univariate_config
overrides:
  output:
    scenario_subpath: aidc_ess_selfuse_load/route_B/baseline
    plot_overlay_path: forecasting_data/B_ESS_PCS_merged_5min_20251001_20260728.csv
    plot_overlay_col: pcs_power
  runtime:
    horizon_mode: fixed_steps
    train_window_length: null
    forecast_mode: forecast
    is_testing: true
    is_forecasting: true
    history_length: 34
    predict_steps: 288
    window_length: 30
    now_time: '2026-07-28T23:55:00'
  target_series:
    data_dir: ./dataset/aidc_ess_selfuse_load/
    data_path: forecasting_data/B_GateEnergys_5min_20251001_20260728_remove_outlier.csv
    freq: 5min
    target_ts_feat: time
    target: value
  exogenous_features:
    weather_backtest_path: null
    strict_weather_information_set: false
    weather_history_source: ''
    weather_backtest_source: ''
    weather_future_source: ''
    enable_date_features: false
    enable_weather_features: false
    datetime_features:
    - hour
    - minute
    - day
    - day_of_week
    - week_of_year
    - month
    - days_in_month
    - quarter
    - day_of_year
    - year
    datetime_categorical_features: []  # 空列表=关闭类别特征(不传 categorical_feature 给 LightGBM)
  time_lag_features:
    lags:
    - 288
    - 576
    - 864
    - 1152
    - 1440
    - 1728
    - 2016
  model_strategy:
    block_size: 96
    quantile_monotone: true
    align_direct_features_to_target: false
    model_type: lightgbm
    pred_method: univariate-single-multistep-direct-recursive
    predict_type: quantile  # 概率预测:输出各分位数(predict_qXX)
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  training_enhancement:
    enable_time_decay_sample_weight: true
    decay_halflife_days: 60  # 半衰期天数,按数据漂移速度调整
  train_outlier:
    enable_train_outlier_handling: false  # 高频稀疏点不宜插值清洗
  eval_mask:
    mode: percentile
    percentile: 5.0
  preprocessing:
    target_calendar_normalization: none
  performance:
    window_parallel_workers: 8
    multi_output_n_jobs: 8
    model_thread_count: 1
