schema_version: 2
problem:
  time_col: time
  freq: 1ME
  horizon: 1
  targets:
  - value
  information_mode: forecast
  training_scope: local
  series_id_cols: []
data:
  sources:
  - name: target_history
    source_type: file
    columns:
    - name: value
      role: target
      categorical: false
    history_path: dataset/aidc_power_month/freq_1month/A_Loads_1month_sum_20251001_20260731.csv
    time_col: time
    series_id_cols: []
    availability: source_time
  - name: weather
    source_type: file
    columns:
    - name: rt_tt2
      role: known_future
      categorical: false
    - name: cal_rh
      role: known_future
      categorical: false
    - name: rt_ssr
      role: known_future
      categorical: false
    - name: rt_ws10
      role: known_future
      categorical: false
    - name: rt_tt2_max
      role: ignored
      categorical: false
    - name: rt_tt2_min
      role: ignored
      categorical: false
    - name: rt_dt
      role: ignored
      categorical: false
    - name: weather_source
      role: ignored
      categorical: true
    - name: source_ts
      role: ignored
      categorical: true
    history_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_202510_202607.csv
    backtest_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_backtest_proxy_202604_202607.csv
    future_path: dataset/aidc_power_month/freq_1month/weather_monthly_stats_future_202608.csv
    time_col: ts
    series_id_cols: []
    availability: column
    available_at_col: available_at
features:
  target_lags:
    value:
    - 1
    - 2
    - 3
  observed_past_lags: {}
  datetime_features:
  - month
  - quarter
  - year
  transformations:
    target:
      calendar_normalization:
        method: per_calendar_day
      decomposition:
        method: none
      scaling:
        method: none
        inverse: false
strategy:
  name: recursive
estimator:
  model_type: lightgbm
  target_adapter: independent
  params:
    min_child_samples: 2
probabilistic:
  mode: quantile
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  point_quantile: 0.5
  recursive_propagation: median_path
  crossing_method: isotonic
  conformal:
    method: none
    coverage: 0.9
    min_scores: 30
    min_windows: 3
validation:
  forecast_origin: '2026-07-31T00:00:00'
  schedule_mode: daily
  horizon_mode: fixed_steps
  history_steps: 12
  train_window_steps: 9
  fold_count: 3
  stride_steps: 1
output:
  scenario_subpath: aidc_power_month/route_A/freq_1month/window_length_10
  setting_suffix: ''
  results_root: results
  directories:
    checkpoints: ./results/pretrained_models/
    tests: ./results/results_test/
    forecast: ./results/results_forecast/
